
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONORA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0c10;
            color: #e8e9ef;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #11131a;
            border-bottom: 1px solid #252833;
        }

        .logo {
            color: #b49aff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .status {
            font-size: 12px;
            color: #77dba1;
        }

        main {
            width: min(760px, 92%);
            margin: 75px auto;
        }

        .hero {
            margin-bottom: 38px;
        }

        .hero h1 {
            font-size: clamp(32px, 6vw, 48px);
            margin-bottom: 12px;
        }

        .hero p {
            color: #9296a5;
            line-height: 1.6;
            font-size: 15px;
        }

        .panel {
            background: #13151d;
            border: 1px solid #292d39;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 13px;
            color: #9b9eae;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        .operations {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .operation {
            background: #1b1e28;
            color: #e8e9ef;
            border: 1px solid #303443;
            border-radius: 8px;
            padding: 19px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .operation:hover {
            border-color: #9275d9;
            background: #242334;
        }

        .operation.active {
            border-color: #a88aff;
            background: #29243a;
        }

        .operation strong {
            display: block;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .operation span {
            color: #9296a5;
            font-size: 12px;
        }

        .upload {
            display: block;
            border: 1px dashed #454a5b;
            border-radius: 9px;
            padding: 35px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload:hover {
            border-color: #a88aff;
            background: #191824;
        }

        .upload input {
            display: none;
        }

        .upload-title {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            color: #9296a5;
            font-size: 12px;
        }

        #filename {
            color: #b49aff;
            font-size: 13px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        .run {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            background: #9675e8;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .run:hover {
            background: #aa8df5;
        }

        .run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background: #1b1e28;
            color: #b9bdcb;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #result.visible {
            display: block;
        }

        footer {
            text-align: center;
            color: #626777;
            font-size: 11px;
            padding: 25px;
        }

        @media (max-width: 550px) {
            main {
                margin-top: 40px;
            }

            .operations {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SONORA</div>
    <div class="status">SYSTEM ONLINE</div>
</header>

<main>

    <section class="hero">
        <h1>Files, transformed.</h1>
        <p>
            A reversible storage system that hides files inside
            ordinary image and audio formats.
        </p>
    </section>

    <section class="panel">
        <div class="section-title">01 / OPERATION</div>

        <div class="operations">
            <button type="button" class="operation" data-operation="encode/png">
                <strong>Encode to PNG</strong>
                <span>File to image</span>
            </button>

            <button type="button" class="operation" data-operation="encode/wav">
                <strong>Encode to WAV</strong>
                <span>File to audio</span>
            </button>

            <button type="button" class="operation" data-operation="decode/png">
                <strong>Decode PNG</strong>
                <span>Image to original file</span>
            </button>

            <button type="button" class="operation" data-operation="decode/wav">
                <strong>Decode WAV</strong>
                <span>Audio to original file</span>
            </button>
        </div>
    </section>

    <section class="panel">
        <div class="section-title">02 / FILE SELECTION</div>

        <label class="upload">
            <input type="file" id="fileInput">

            <div class="upload-title">Select a file to process</div>
            <div class="upload-subtitle">Maximum file size: 25 MB</div>

            <div id="filename">No file selected</div>
        </label>

        <button type="button" class="run" id="runButton">
            Execute operation
        </button>

        <div id="result"></div>
    </section>

</main>

<footer>
    SONORA / MYTHOS STUDIOS
</footer>

<script>
    const buttons = document.querySelectorAll(".operation");
    const fileInput = document.getElementById("fileInput");
    const filename = document.getElementById("filename");
    const runButton = document.getElementById("runButton");
    const result = document.getElementById("result");

    let selectedOperation = null;

    function showResult(message) {
        result.textContent = message;
        result.classList.add("visible");
    }

    // Operation selection
    buttons.forEach(button => {
        button.addEventListener("click", () => {
            buttons.forEach(item => item.classList.remove("active"));

            button.classList.add("active");
            selectedOperation = button.dataset.operation;

            showResult("Selected operation: " + selectedOperation);
        });
    });

    // File selection
    fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];

        filename.textContent = file
            ? file.name + " (" + (file.size / 1024).toFixed(2) + " KB)"
            : "No file selected";
    });

    // Process file
    runButton.addEventListener("click", async () => {
        const file = fileInput.files[0];

        if (!selectedOperation) {
            showResult("Please select an operation.");
            return;
        }

        if (!file) {
            showResult("Please select a file.");
            return;
        }

        if (file.size > 25 * 1024 * 1024) {
            showResult("File exceeds the 25 MB limit.");
            return;
        }

        runButton.disabled = true;
        runButton.textContent = "Processing...";
        showResult("Uploading and processing your file...");

        try {
            const formData = new FormData();
            formData.append("file", file);

            const response = await fetch(
                "/" + selectedOperation,
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                let message = "Operation failed.";

                try {
                    const error = await response.json();
                    message = error.detail || message;
                } catch {}

                throw new Error(message);
            }

            const blob = await response.blob();

            let downloadName;

            if (selectedOperation === "encode/png") {
                downloadName = "sonora.png";
            } else if (selectedOperation === "encode/wav") {
                downloadName = "sonora.wav";
            } else {
                downloadName =
                    response.headers.get("X-SONORA-Filename")
                    || "recovered.bin";
            }

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = downloadName;

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            showResult("Success! Downloaded: " + downloadName);

        } catch (error) {
            showResult("Error: " + error.message);
        } finally {
            runButton.disabled = false;
            runButton.textContent = "Execute operation";
        }
    });
</script>

</body>
</html>
